version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: scope
    groups:
      terraform-plugin:
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"
      grpc-proto:
        patterns:
          - "google.golang.org/grpc"
          - "google.golang.org/protobuf"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
      include: scope
    # One grouped PR per week — avoids splitting multi-path actions like
    # github/codeql-action (init/autobuild/analyze/upload-sarif) into separate
    # PRs that break the CodeQL version-consistency check individually.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/deployments/containers"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
      include: scope
