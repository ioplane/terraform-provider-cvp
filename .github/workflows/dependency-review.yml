name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Block viral copyleft (incompatible with the Apache-2.0 provider, ADR
          # 0002). A deny-list is used rather than an allow-list because Go
          # modules from Google ship a compound "BSD-3-Clause AND
          # LicenseRef-...google-patent-license" expression that trips allow-list
          # matching (a well-known false positive).
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            LGPL-2.0-only, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later
          # CI-only GitHub Actions are not linked into the Apache-2.0 provider,
          # so their (weak-copyleft) licenses are exempt from the product policy.
          allow-dependencies-licenses: >-
            pkg:githubactions/SonarSource/sonarqube-scan-action
          comment-summary-in-pr: on-failure
