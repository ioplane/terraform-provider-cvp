name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` so a PR-title change re-runs the commitlint check.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-trixie
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Build
        shell: bash
        env:
          GOFLAGS: -buildvcs=false
        run: go build -ldflags="-s -w -X main.version=ci-${GITHUB_SHA::8}" -o bin/terraform-provider-cvp .

      - name: Install test tooling
        run: go install gotest.tools/gotestsum@latest

      - name: Test with coverage
        env:
          GOFLAGS: -buildvcs=false
        run: |
          gotestsum --junitfile unit-report.xml --format short-verbose \
            -- ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            unit-report.xml
            coverage.out
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  lint-go:
    name: Lint (Go · golangci-lint v2)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=10m

  vulncheck:
    name: Vulnerability audit
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-trixie
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  proto:
    name: Proto (buf lint · generated in sync)
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-trixie
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install buf + protoc plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: buf lint + regenerate diff
        shell: bash
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          # Container job: the checkout is owned by a different uid, so git
          # refuses without an explicit safe.directory.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -z "$(find api/proto -name '*.proto' 2>/dev/null | head -1)" ]; then
            echo "no .proto files yet (P1) — skipping"; exit 0
          fi
          buf lint
          buf generate
          if ! git diff --quiet -- internal/pb; then
            echo "::error::internal/pb is out of date — run 'task proto' and commit the result"
            git diff --stat -- internal/pb
            exit 1
          fi

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SonarCloud computes new-code / blame accurately.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - name: Run tests with coverage
        env:
          GOFLAGS: -buildvcs=false
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: Check Sonar token
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "mode=skip-dependabot" >> "$GITHUB_OUTPUT"
          else
            echo "SONAR_TOKEN is required for non-Dependabot SonarQube scans" >&2
            exit 1
          fi
      - name: SonarQube Scan
        if: steps.sonar-token.outputs.mode == 'run'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube skipped for Dependabot
        if: steps.sonar-token.outputs.mode == 'skip-dependabot'
        run: |
          echo "Skipping SonarQube (Dependabot run without a SONAR_TOKEN secret)."

  terraform:
    name: Terraform (fmt · validate examples)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: terraform fmt -check
        run: |
          curl -fsSL "https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip" -o /tmp/tf.zip
          sudo unzip -o -d /usr/local/bin /tmp/tf.zip
          terraform fmt -check -recursive examples

  lint-py:
    name: Lint (Python · ruff · ty)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
      - name: ruff + ty
        working-directory: scripts/automation
        run: |
          uv tool run ruff@0.16.0 check .
          uv tool run ruff@0.16.0 format --check .
          uv run --locked --with ty==0.0.64 ty check .

  lint-docs:
    name: Lint (docs · markdown · yaml · spell)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm install -g markdownlint-cli2@latest cspell@latest
      - run: pip install --user yamllint
      - name: markdownlint
        run: markdownlint-cli2 "**/*.md" "#node_modules" "#bin" "#dist"
      - name: yamllint
        run: ~/.local/bin/yamllint -c .yamllint.yaml .
      - name: cspell
        run: cspell --no-progress --no-summary --config .cspell.json "**/*.md" "**/*.go"

  commitlint:
    name: Commitlint (PR title)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm install -g @commitlint/cli@latest @commitlint/config-conventional@latest
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | commitlint --config .commitlintrc.yaml
