# Pre-commit hooks. Install with:  pre-commit install --hook-type commit-msg --hook-type pre-commit
# Go hooks run inside the dev container so no host Go toolchain is needed.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/igorshubovych/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint-cli2.yaml"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional@19"

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (task lint)
        entry: task lint
        language: system
        types: [go]
        pass_filenames: false

      - id: terraform-fmt
        name: terraform fmt (task tffmt-check)
        entry: task tffmt-check
        language: system
        files: '\.tf$'
        pass_filenames: false

      - id: ruff-ty
        name: python automation lint (task lint-py)
        entry: task lint-py
        language: system
        files: '^scripts/automation/.*\.py$'
        pass_filenames: false
