# Taskfile for terraform-provider-cvp — https://taskfile.dev
#
# Replaces the Makefile. All Go/Terraform commands run inside the Podman dev
# container; no host Go toolchain is required. Run on the host with `task <name>`
# (needs `task` + `podman-compose`). See docs/development.md.
version: "3"

vars:
  TYPE: cvp
  BINARY: terraform-provider-cvp
  COMPOSE_FILE: deployments/compose/compose.dev.yml
  DC: podman-compose -f deployments/compose/compose.dev.yml
  EXEC: podman-compose -f deployments/compose/compose.dev.yml exec -T dev
  SDK_EXEC: "{{.EXEC}} env GOWORK=/app/.cache/cvp-sdk/go.work"
  SEMGREP_CONFIG: --config p/golang --config p/terraform --config p/dockerfile --config p/github-actions --config p/secrets
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || cat VERSION 2>/dev/null || echo dev
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X main.version={{.VERSION}}
    -X main.commit={{.GIT_COMMIT}}
    -X main.date={{.BUILD_DATE}}

tasks:
  default:
    desc: List available tasks.
    silent: true
    cmds:
      - task --list

  # === Lifecycle ===
  up:
    desc: Build the dev image and start the container.
    cmds: ["{{.DC}} up -d --build"]
  down:
    desc: Stop and remove the dev container.
    cmds: ["{{.DC}} down"]
  restart:
    desc: Restart the dev container.
    cmds: [{ task: down }, { task: up }]
  logs:
    desc: Follow the dev container logs.
    cmds: ["{{.DC}} logs -f dev"]
  shell:
    desc: Open a shell inside the dev container.
    cmds: ["{{.DC}} exec dev bash"]

  # === Build ===
  build:
    deps: [sdk-check]
    desc: Build the provider binary into bin/.
    cmds: ["{{.SDK_EXEC}} go build -ldflags='{{.LDFLAGS}}' -o bin/{{.BINARY}} ."]
  install:
    deps: [sdk-check]
    desc: go install the provider (for dev_overrides).
    cmds: ["{{.SDK_EXEC}} go install -ldflags='{{.LDFLAGS}}' ."]

  # === Test ===
  test:
    deps: [sdk-check]
    desc: Unit tests with the race detector.
    cmds: ["{{.SDK_EXEC}} go test ./... -race -count=1"]
  test-v:
    deps: [sdk-check]
    desc: Unit tests, verbose.
    cmds: ["{{.SDK_EXEC}} go test ./... -race -count=1 -v"]
  test-run:
    deps: [sdk-check]
    desc: 'Run a single test: task test-run RUN=TestX PKG=./internal/x'
    preconditions:
      - sh: test -n "{{.RUN}}"
        msg: "Usage: task test-run RUN=TestX PKG=./internal/x"
    cmds: ["{{.SDK_EXEC}} go test -run '{{.RUN}}' {{.PKG}} -race -count=1 -v"]
  testacc:
    deps: [sdk-check]
    desc: Acceptance tests against the live CVP lab (TF_ACC=1, tag acceptance).
    cmds:
      - >-
        {{.SDK_EXEC}} env TF_ACC=1
        CVP_ENDPOINT="$CVP_ENDPOINT"
        CVP_AUTH_METHOD="$CVP_AUTH_METHOD"
        CVP_TOKEN="$CVP_TOKEN"
        go test -tags acceptance ./... -race -count=1 -timeout 120m -v

  # === Quality ===
  lint:
    deps: [sdk-check]
    desc: golangci-lint v2.
    cmds: ["{{.SDK_EXEC}} golangci-lint run ./..."]
  lint-fix:
    deps: [sdk-check]
    desc: golangci-lint with autofix.
    cmds: ["{{.SDK_EXEC}} golangci-lint run --fix ./..."]
  vulncheck:
    deps: [sdk-check]
    desc: govulncheck.
    cmds: ["{{.SDK_EXEC}} govulncheck ./..."]
  osv-scan:
    desc: osv-scanner.
    cmds: ["{{.SDK_EXEC}} osv-scanner scan --recursive ."]
  gosec:
    deps: [sdk-check]
    desc: gosec only (via golangci-lint).
    cmds: ["{{.SDK_EXEC}} golangci-lint run --enable-only gosec ./..."]
  semgrep:
    desc: SAST with Semgrep (host tool — uses your login for Pro rules; Go/Terraform/Dockerfile/Actions/secrets).
    cmds:
      - "semgrep scan {{.SEMGREP_CONFIG}} --metrics=off --disable-version-check --error"

  # === SonarCloud management (Web API; host python + gopass token) ===
  sonar-status:
    desc: Show the SonarCloud quality-gate status (token from gopass).
    cmds:
      - 'SONAR_MGMT_TOKEN="$(gopass show -o infra4/sonarcloud/management-token)" python3 scripts/automation/sonarcloud.py status'
  sonar-gate:
    desc: Show the assigned SonarCloud quality gate.
    cmds:
      - 'SONAR_MGMT_TOKEN="$(gopass show -o infra4/sonarcloud/management-token)" python3 scripts/automation/sonarcloud.py gate'

  # === Python automation (podman-py) — uv + ruff + ty ===
  lint-py:
    desc: Lint + type-check the podman-py automation (ruff + ty).
    cmds:
      - >-
        {{.EXEC}} sh -c 'cd scripts/automation && uv tool run ruff check . && uv tool run ruff format --check . && uv run
        --locked --with ty==0.0.64 ty check .'
  fmt-py:
    desc: Auto-format + fix the podman-py automation (ruff).
    cmds:
      - "{{.EXEC}} sh -c 'cd scripts/automation && uv tool run ruff format . && uv tool run ruff check --fix .'"

  # === Shared SDK candidate (no provider-local code generation) ===
  sdk-check:
    desc: Verify exact SDK source and prepare the temporary Go workspace.
    cmds:
      - "{{.EXEC}} python3 scripts/automation/sdk.py prepare"
  sdk-tidy-check:
    desc: Check module metadata without a published SDK version.
    cmds:
      - "{{.EXEC}} python3 scripts/automation/sdk.py check-tidy"

  # === Terraform formatting (examples) ===
  tffmt:
    desc: terraform fmt the examples.
    cmds: ["{{.EXEC}} terraform fmt -recursive examples"]
  tffmt-check:
    desc: terraform fmt -check the examples.
    cmds: ["{{.EXEC}} terraform fmt -check -recursive examples"]

  # === Docs ===
  docs:
    deps: [sdk-check]
    desc: Generate Terraform Registry docs (tfplugindocs).
    cmds: ["{{.SDK_EXEC}} tfplugindocs generate --provider-name {{.TYPE}}"]
  docs-check:
    deps: [sdk-check]
    desc: Validate Terraform Registry docs.
    cmds: ["{{.SDK_EXEC}} tfplugindocs validate --provider-name {{.TYPE}}"]
  lint-md:
    desc: markdownlint.
    cmds: ['{{.EXEC}} markdownlint-cli2 "**/*.md" "#node_modules" "#bin" "#dist"']
  lint-yaml:
    desc: yamllint.
    cmds: ["{{.EXEC}} yamllint -c .yamllint.yaml ."]
  lint-spell:
    desc: cspell.
    cmds: ['{{.EXEC}} cspell --no-progress --no-summary --config .cspell.json "**/*.md" "**/*.go"']
  lint-docs:
    desc: All documentation linters + registry-doc validation.
    cmds:
      - task: lint-md
      - task: lint-yaml
      - task: lint-spell
      - task: docs-check

  # === Deps ===
  tidy:
    desc: go mod tidy.
    cmds: ["{{.EXEC}} python3 scripts/automation/sdk.py tidy"]
  download:
    deps: [sdk-check]
    desc: go mod download.
    cmds: ["{{.SDK_EXEC}} go mod download"]

  # === Aggregate gates ===
  all:
    desc: "Pre-PR gate: build + test + lint + lint-py + tffmt-check + lint-docs + vulncheck."
    cmds:
      - task: build
      - task: test
      - task: lint
      - task: lint-py
      - task: tffmt-check
      - task: lint-docs
      - task: vulncheck
      - task: sdk-tidy-check
  verify:
    desc: "Full gate: all + live acceptance tests."
    cmds:
      - task: all
      - task: testacc
      - cmd: echo "verify — all gates green"

  # === Misc ===
  clean:
    desc: Remove build/report artifacts.
    cmds: ["rm -rf bin/ dist/ reports/ coverage.out coverage.html"]
  versions:
    desc: Print the toolchain versions.
    cmds:
      - 'echo "task (host):  $(task --version)"'
      - >-
        {{.EXEC}} sh -c 'go version; terraform version | head -1; tofu version | head -1; terragrunt --version | head -1;
        golangci-lint version --short; buf --version; uv --version'
