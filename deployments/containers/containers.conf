# containers.conf — terraform-provider-cvp project-scoped runtime configuration.
# Spec: containers.conf.5
#   https://github.com/containers/common/blob/main/docs/containers.conf.5.md
#
# Apply via:
#   export CONTAINERS_CONF=$(pwd)/deployments/containers/containers.conf
#
# Settings here pin runtime defaults so the dev / acceptance loops are
# reproducible across hosts. The Compose Specification stacks under
# deployments/compose/ inherit them automatically when CONTAINERS_CONF is
# exported in the shell that invokes podman-compose.

[containers]
# keep-id preserves the host UID inside the container, matching the bind-mount
# semantics the dev container relies on for /app and the /go module cache.
userns = "keep-id"

# The provider makes only outbound gRPC/TLS calls to CVP; no elevated
# capabilities are required. Compose drops ALL and adds nothing back.
default_capabilities = [
  "CHOWN",
  "DAC_OVERRIDE",
  "FOWNER",
  "FSETID",
  "KILL",
  "NET_BIND_SERVICE",
  "SETFCAP",
  "SETGID",
  "SETPCAP",
  "SETUID",
  "SYS_CHROOT",
]

# Match the host's init so signal-forwarding behaves predictably across
# `podman exec` invocations from `task verify`.
init = true

dns_options = ["edns0"]

# Time-zone defaults to host so log timestamps line up with developer machines.
tz = "local"

[engine]
# Re-use images already on disk; avoid accidental pulls of the local dev image.
pull_policy = "missing"

# Keep `podman compose` aligned with `podman-compose` semantics.
compose_providers = ["podman-compose"]

stop_timeout = 10

[network]
# netavark backend (CNI is deprecated); enables host.containers.internal.
network_backend = "netavark"
