sonar.projectKey=ioplane_terraform-provider-cvp
sonar.organization=ioplane

# Go coverage report (produced by the SonarQube CI job).
sonar.go.coverage.reportPaths=coverage.out

# Exclude generated stubs and the provider-server entry point from coverage —
# they are validated by build, lint, security, and (for CRUD) acceptance tests.
sonar.coverage.exclusions=\
  main.go,\
  internal/pb/**

# Exclude from analysis: generated code, tests, examples, infra, docs.
sonar.exclusions=\
  internal/pb/**,\
  **/*_test.go,\
  examples/**,\
  docs/**,\
  deployments/**,\
  scripts/**,\
  api/**,\
  templates/**
